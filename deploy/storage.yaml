apiVersion: v1
kind: ConfigMap
metadata:
  name: job-console-storage
data:
  S3_ENDPOINT: http://rustfs:9000
  S3_BUCKET: job-console
  S3_PATH_STYLE: "true"
  AWS_REGION: us-east-1
  S3_RETENTION_DAYS: "30"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: rustfs}
  template:
    metadata:
      labels: {app: rustfs}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.5
          ports: [{containerPort: 9000}]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: job-console-storage, key: AWS_ACCESS_KEY_ID}}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: job-console-storage, key: AWS_SECRET_ACCESS_KEY}}
            - {name: RUSTFS_CONSOLE_ENABLE, value: "false"}
            - {name: RUSTFS_OBS_LOG_DIRECTORY, value: /tmp/rustfs}
          readinessProbe:
            httpGet: {path: /health, port: 9000}
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: storage, mountPath: /data}]
      volumes:
        - name: storage
          persistentVolumeClaim: {claimName: rustfs}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector: {app: rustfs}
  ports: [{port: 9000}]
