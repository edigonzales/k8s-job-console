apiVersion: v1
kind: ConfigMap
metadata:
  name: job-console-runtime
data:
  runtime.json: '{"schemaVersion":1}'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: launcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launcher
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, list, patch, update, delete]
  - apiGroups: [argoproj.io]
    resources: [cronworkflows]
    verbs: [get, list, patch]
  - apiGroups: [argoproj.io]
    resources: [workflowtemplates]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [job-console-catalog]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launcher
subjects:
  - {kind: ServiceAccount, name: launcher}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: launcher}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: launcher
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: launcher}
  template:
    metadata:
      labels: {app: launcher}
    spec:
      serviceAccountName: launcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: launcher
          image: job-console-control:local
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: OIDC_DEV_MODE, value: "true"}
            - {name: OIDC_ISSUER, value: "http://127.0.0.1:4466/identity/realms/job-console"}
            - {name: OIDC_JWKS, value: "http://job-console-keycloak:8080/identity/realms/job-console/protocol/openid-connect/certs"}
            - {name: OIDC_AUDIENCE, value: job-console-api}
            - {name: CONSOLE_ADMIN_GROUPS, value: console-admins}
            - {name: LOCAL_ORIGINS, value: "http://127.0.0.1:4466"}
            - {name: ARGO_ENDPOINT, value: "https://argo-server:2746"}
            - {name: NODE_EXTRA_CA_CERTS, value: "/argo-ca/tls.crt"}
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          envFrom:
            - configMapRef: {name: job-console-sync}
            - configMapRef: {name: job-console-storage}
            - secretRef: {name: job-console-storage}
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi, cpu: "1"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          volumeMounts:
            - {name: argo-ca, mountPath: /argo-ca, readOnly: true}
      volumes:
        - name: argo-ca
          secret:
            secretName: job-console-argo-tls
            items: [{key: tls.crt, path: tls.crt}]
---
apiVersion: v1
kind: Service
metadata:
  name: launcher
spec:
  selector: {app: launcher}
  ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: launcher
spec:
  podSelector: {matchLabels: {app: launcher}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: headlamp}}
      ports: [{port: 8080}]
