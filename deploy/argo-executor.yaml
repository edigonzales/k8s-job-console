apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-console-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-console-executor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-console-executor
subjects:
  - kind: ServiceAccount
    name: job-console-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-console-executor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-console-artifacts
data:
  rustfs: |
    s3:
      endpoint: rustfs:9000
      bucket: job-console
      insecure: true
      keyFormat: artifacts/{{workflow.name}}/{{pod.name}}
      accessKeySecret:
        name: job-console-storage
        key: AWS_ACCESS_KEY_ID
      secretKeySecret:
        name: job-console-storage
        key: AWS_SECRET_ACCESS_KEY
